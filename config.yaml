  results: results_no_macd_20261012_141417

data:
  train_start: "2015-01-01"
  train_end:   "2019-12-31"
  test_start:  "2020-01-01"
  test_end:    "2025-12-31"
  train_valid_split: 0.7

universe:
  ipo_buffer_days: 1
  exclude_limit_rebalance: true
  exclude_limit_entry: false
  exclude_limit_in_window: false
  exclude_st_in_window: true
  exclude_suspension_in_window: true

image:
  channels: 1
  windows: {I20: 20, I60: 60}
  height: 100
  px_per_day: 3
  price_rows: 70
  volume_rows: 15
  macd_rows: 15  # 保留原区域和图片尺寸，但不计算或绘制 MACD。
  return_horizon_days: 5

cnn:
  task: regression
  target: future_ret
  in_channels: 1
  winsor_quantiles: [0.01, 0.99]
  select: spearman
  conv_kernel:  [5, 3]
  conv_stride:  [3, 1]
  conv_padding: [12, 1]
  pool_kernel:  [2, 1]
  pool_stride:  [2, 1]
  leaky_relu_slope: 0.01
  dropout_fc: 0.5
  filters:
    I20: [64, 128, 256]
    I60: [64, 128, 256, 512]
  ensemble_seeds: 5
  optimizer: {name: adam, lr: 1.0e-5}
  batch_size: 128
  max_epochs: 10

backtest:
  rebalance_freq: "D"
  n_sleeves: 5
  top_frac: 0.10
  deciles: 10
  trading_days_per_year: 252
  transaction_cost_bps: 5
