project:
  root: .
  random_seed: 20260417

paths:
  processed: "/home/shixi05/ChenSiwei/0914/data/processed"
  images: data/images/i20_attention_v1
  # 复用 attention_v1 图像；分层卷积版使用独立输出目录。
  images_remote: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_body_i20_attention_v1"
  output_remote: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_body_i20_layered_conv_v1"
  pingquan_csv: "/storage/server/227server/marketdata/pingquan/daily/pingquan.csv"
  figures: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_body_i20_layered_conv_v1/figures"
  logs: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_body_i20_layered_conv_v1/logs"
  models: models/i20_layered_conv_v1
  results: results/i20_layered_conv_v1

data:
  train_start: "2015-01-01"
  train_end:   "2019-12-31"
  test_start:  "2020-01-01"
  test_end:    "2025-12-31"
  train_valid_split: 0.7

universe:
  ipo_buffer_days: 1
  exclude_limit_rebalance: true
  exclude_limit_entry: false
  exclude_limit_in_window: false
  exclude_st_in_window: true
  exclude_suspension_in_window: true

image:
  channels: 1
  windows: {I20: 20, I60: 60}
  height: 100
  px_per_day: 3
  price_rows: 70
  volume_rows: 15
  macd_rows: 15
  return_horizon_days: 5
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  macd_warmup: 105

cnn:
  task: regression
  target: future_ret
  in_channels: 1
  temporal_attention: true
  winsor_quantiles: [0.01, 0.99]
  select: daily_rank_ic
  # 以纯 MSE + 随机取样 + 日均 Rank IC 版为对照，仅检验 I20 卷积几何。
  loss: mse
  conv_kernel:  [5, 3]
  conv_stride:
    I20: [[1, 1], [2, 1], [2, 1]]
    I60: [3, 1]  # I60 四层保持原配置，本轮不调整。
  conv_padding:
    I20: [[2, 1], [2, 1], [2, 1]]
    I60: [12, 1]
  pool_kernel:  [2, 1]
  pool_stride:  [2, 1]
  leaky_relu_slope: 0.01
  dropout_fc: 0.5
  filters:
    I20: [64, 128, 256]
    I60: [64, 128, 256, 512]
  ensemble_seeds: 3
  optimizer: {name: adam, lr: 1.0e-5}
  batch_size: 128
  max_epochs: 10

backtest:
  rebalance_freq: "D"
  n_sleeves: 5
  top_frac: 0.10
  deciles: 10
  trading_days_per_year: 252
  transaction_cost_bps: 5
