project:
  root: .
  random_seed: 20260417

paths:
  processed: "/home/shixi05/ChenSiwei/0914/data/processed"
  images: data/images
  # 周 K。不要覆盖 k_pictures_gray_body、k_pictures_rgb_I20、k_pictures_gray_reg。
  images_remote: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_week"
  output_remote: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_week"
  pingquan_csv: "/storage/server/227server/marketdata/pingquan/daily/pingquan.csv"
  figures: figures
  logs: logs
  models: models
  results: results

data:
  train_start: "2015-01-01"
  train_end:   "2019-12-31"
  test_start:  "2020-01-01"
  test_end:    "2025-12-31"
  train_valid_split: 0.7

universe:
  ipo_buffer_days: 1
  exclude_limit_rebalance: true
  exclude_limit_entry: false
  exclude_limit_in_window: false
  exclude_st_in_window: true
  exclude_suspension_in_window: true

image:
  bar: week
  channels: 1
  windows: {I20: 20, I60: 60}
  # 20 根周 K 最多跨 100 个交易日。训练/验证/测试之间空出这么多天，避免同一根周 K 进两个集合。
  embargo_days: 100
  height: 100
  px_per_day: 3
  price_rows: 70
  volume_rows: 15
  macd_rows: 15
  return_horizon_days: 5
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  macd_warmup: 105

cnn:
  task: regression
  target: future_ret
  in_channels: 1
  winsor_quantiles: [0.01, 0.99]
  select: spearman
  conv_kernel:  [5, 3]
  conv_stride:  [3, 1]
  conv_padding: [12, 1]
  pool_kernel:  [2, 1]
  pool_stride:  [2, 1]
  leaky_relu_slope: 0.01
  dropout_fc: 0.5
  filters:
    I20: [64, 128, 256]
    I60: [64, 128, 256, 512]
  ensemble_seeds: 5
  optimizer: {name: adam, lr: 1.0e-5}
  batch_size: 128
  max_epochs: 10

backtest:
  rebalance_freq: "W"
  # 持有 5 个交易日，正常一周只开着 1 个组合。槽位留 5 个，是为了短周（间隔不到 5 天）
  # 和还没到期的持仓重叠时，两笔收益都记上。不满 1 个组合的日期才丢掉。
  n_sleeves: 5
  min_sleeves: 1
  top_frac: 0.10
  deciles: 10
  trading_days_per_year: 252
  transaction_cost_bps: 5
