project:
  root: .
  random_seed: 20260417

paths:
  processed: "/home/shixi05/ChenSiwei/0914/data/processed"
  images: data/images
  week_images: data/week_images
  # 日 K 只读，不要往这里写。
  images_remote: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_body"
  # 每个已走完的周一张图。周一到周四复用最近的这一张。
  week_images_remote: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_fuse_week"
  # 权重、配对表、预测。不要写回 gray_body 或 gray_week。
  output_remote: "/storage/server/144server/cq/ChenSiwei/k_pictures_gray_fuse"
  pingquan_csv: "/storage/server/227server/marketdata/pingquan/daily/pingquan.csv"
  figures: figures
  logs: logs
  models: models
  results: results

data:
  train_start: "2015-01-01"
  train_end:   "2019-12-31"
  test_start:  "2020-01-01"
  test_end:    "2025-12-31"
  train_valid_split: 0.7

universe:
  ipo_buffer_days: 1
  exclude_limit_rebalance: true
  exclude_limit_entry: false
  exclude_limit_in_window: false
  exclude_st_in_window: true
  exclude_suspension_in_window: true

image:
  channels: 1
  windows: {I20: 20, I60: 60}
  height: 100
  px_per_day: 3
  price_rows: 70
  volume_rows: 15
  macd_rows: 15
  return_horizon_days: 5
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  macd_warmup: 105

cnn:
  task: regression
  target: future_ret
  in_channels: 1
  winsor_quantiles: [0.01, 0.99]
  select: spearman
  conv_kernel:  [5, 3]
  conv_stride:  [3, 1]
  conv_padding: [12, 1]
  pool_kernel:  [2, 1]
  pool_stride:  [2, 1]
  leaky_relu_slope: 0.01
  dropout_fc: 0.5
  filters:
    I20: [64, 128, 256]
    I60: [64, 128, 256, 512]
  ensemble_seeds: 5
  optimizer: {name: adam, lr: 1.0e-5}
  batch_size: 128
  max_epochs: 10

fuse:
  # [day, week] 是两个塔拼接。[day] 是同一批样本上的日 K 对照，用来看周 K 有没有增量。
  inputs: [day, week]
  # 20 根周 K 大约 100 个交易日。切分间隔按这个来，避免同一根周 K 出现在训练和验证里。
  embargo_days: 100

backtest:
  rebalance_freq: "D"
  n_sleeves: 5
  top_frac: 0.10
  deciles: 10
  trading_days_per_year: 252
  transaction_cost_bps: 5
